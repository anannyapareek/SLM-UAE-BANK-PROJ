# Step 7 (runbook 7.x; decisions log 2026-11-14). Everything here is fitted on validation or
# calibration only, never on test.
calibration:
  fit_split: calib
  temperature_bounds: [0.05, 20]     # runbook 7.1: minimize_scalar, method "bounded"
  methods: [temperature, platt]      # temperature = primary; platt = sensitivity row
  out: results/step7/calibration
  models:
    # fit_units: session = fit on each calib session's max margin (C1 primary);
    #            row = fit on calib rows (secondary view; the hybrid's scale).
    # C2 files hold one logoff row per session, so their single fit is both.
    - {key: xgb_struct, comparison: C1, folder: "results/xgb_struct_v3_s{seed}", suffix: "", fit_units: [session, row]}
    - {key: slm_struct, comparison: C1, folder: "results/c1_qwen15_r8_lr1e-4_s{seed}", suffix: "", fit_units: [session, row]}
    - {key: xgb_text, comparison: C2, folder: "results/xgb_text_s{seed}", suffix: "_final", fit_units: [session]}
    - {key: slm_text, comparison: C2, folder: "results/c2_qwen15_r8_lr1e-4_s{seed}", suffix: "_final", fit_units: [session]}
  seeds: [1, 2, 3]
  splits: [valid, calib, test]

hybrid:                              # runbook 7.2 (decisions log 2026-11-14)
  # Platt row-level calibrated scores for both models (common probability scale)
  xgb: results/step7/calibration/xgb_struct_rowfit_platt/s{seed}
  slm: results/step7/calibration/slm_struct_rowfit_platt/s{seed}
  seeds: [1, 2, 3]                   # seed i pairs with seed i; one band for all seeds
  select_split: valid                # band chosen on validation only
  max_share: 0.20                    # X: at most 20% of rows sent to the SLM (every seed)
  level_step: 0.01                   # candidate a, b = quantiles of pooled calibrated XGBoost valid scores
  top: 10
  sensitivity_caps: [0.05, 0.10, 0.20, 0.30]   # secondary, validation only; 0.20 = primary
  build_splits: [valid, calib, test]   # valid needed later for 7.5 validation thresholds
  out: results/step7/hybrid

rules_slm:                           # runbook 7.3 (decisions log 2026-11-14)
  rules: results/rules               # rules_fired per row; weights from configs/rules.yaml
  slm: results/step7/calibration/slm_struct_rowfit_platt/s{seed}   # same scale as the hybrid
  seeds: [1, 2, 3]
  out: results/step7/rules_slm

table3:                              # runbook 7.4 (Comparison 3, test)
  # XGBoost and SLM: the Platt row-fit files the hybrid is built from (ranking metrics equal
  # Table 1's within the 1e-6 float32 tolerance of ranking_check.md). Rules: deterministic run.
  models:
    xgb: results/step7/calibration/xgb_struct_rowfit_platt/s{seed}
    slm: results/step7/calibration/slm_struct_rowfit_platt/s{seed}
    hybrid: results/step7/hybrid/s{seed}
    rules: results/rules
    rules_slm: results/step7/rules_slm/s{seed}
  seeded: [xgb, slm, hybrid, rules_slm]
  paired: [[hybrid, xgb], [hybrid, slm], [rules_slm, rules]]   # hybrid vs XGBoost = key test
  session_aggs: [max, final]
  slm_rows_per_second: 116.8         # RTX 4500 Ada, fp16 merged adapter (decisions log 2026-11-10)
  xgb_timing: results/step7/xgb_timing.json
  out: results/step7/table3

abstention:                          # runbook 7.5 (decisions log 2026-11-14)
  # Session level. Scores on the calibrated logit scale: Platt session fit for single models
  # (a * margin + b), the hybrid's stored Platt row-fit logit. Any affine logit map (temperature
  # or Platt) gives the same thresholds and deferral order, so the choice does not change results.
  threshold_split: valid
  fpr: 0.05                          # each model/seed's validation session-level 5%-FPR threshold
  shares: {start: 0.0, stop: 0.5, step: 0.01}
  operating_point: 0.10
  extra_points: [0.01, 0.02]         # workable workloads; the P7 capacity share is added after P7
  exploratory_paired:                # NOT pre-declared; reported as exploratory (decisions log)
    - {a: slm_text, b: xgb_text, points: [0.0, 0.10],
       metrics: [system_recall_upper, precision_auto, recall_auto]}
  seeds: [1, 2, 3]
  models:
    - {key: xgb, figure: main, kind: calibrated, folder: "results/step7/calibration/xgb_struct_sessionfit_platt/s{seed}", suffix: ""}
    - {key: slm, figure: main, kind: calibrated, folder: "results/step7/calibration/slm_struct_sessionfit_platt/s{seed}", suffix: ""}
    - {key: hybrid, figure: main, kind: logit, folder: "results/step7/hybrid/s{seed}", suffix: ""}
    - {key: xgb_text, figure: appendix, kind: calibrated, folder: "results/step7/calibration/xgb_text_sessionfit_platt/s{seed}", suffix: "_final"}
    - {key: slm_text, figure: appendix, kind: calibrated, folder: "results/step7/calibration/slm_text_sessionfit_platt/s{seed}", suffix: "_final"}
  out: results/step7/abstention
